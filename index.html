<meta charset="UTF-8">

<title>Radyoaktif Laboratuvar</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #0a0a0f; font-family: 'Courier New', monospace; }
  #canvas { display: block; }

  #ui {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }

  #elements-btn {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);

    transition: all 0.2s; user-select: none;
  }
  #elements-btn:hover { background: rgba(30,50,30,0.95); border-color: #7fff7f; color: #fff; }

  #elements-panel {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
    background: rgba(8,12,18,0.97); border: 1px solid #2a4a2a;
    padding: 16px; display: none; pointer-events: all;
    min-width: 320px; max-height: 60vh; overflow: hidden;
    display: none; flex-direction: column;

  #elements-panel h3 {
    color: #5aff5a; font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase; margin-bottom: 12px; border-bottom: 1px solid #1a3a1a; padding-bottom: 8px;

  }
  #elements-list {
    overflow-y: auto; flex: 1;
    scrollbar-width: thin; scrollbar-color: #2a4a2a #0a0f0a;
  }
  #elements-list::-webkit-scrollbar { width: 4px; }
  #elements-list::-webkit-scrollbar-track { background: #0a0f0a; }
  #elements-list::-webkit-scrollbar-thumb { background: #2a4a2a; border-radius: 2px; }
  .element-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px;
    cursor: pointer; transition: background 0.15s; margin-bottom: 2px;
    border: 1px solid transparent;

  .element-item:hover { background: rgba(90,255,90,0.07); border-color: #2a4a2a; }
  .element-item.active { background: rgba(90,255,90,0.12); border-color: #3a6a3a; }

    position: relative; width: 40px; height: 40px; flex-shrink: 0;
  }
  .el-symbol {
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: bold; color: #fff;
    border: 1px solid; position: relative; z-index: 1;
  }
  .rad-sign {
    position: absolute; top: -6px; right: -6px; width: 14px; height: 14px;
    z-index: 2;
  }
  .el-info { flex: 1; min-width: 0; }
  .el-name { color: #ccc; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .el-detail { color: #556; font-size: 9px; letter-spacing: 1px; margin-top: 2px; }
  .el-activity { font-size: 10px; text-align: right; flex-shrink: 0; }
  .activity-bar {
    width: 50px; height: 3px; background: #1a2a1a; margin-top: 4px;
    border-radius: 2px; overflow: hidden;
  }
  .activity-fill { height: 100%; border-radius: 2px; }

  #info-panel {
    position: fixed; top: 20px; right: 20px;
    background: rgba(8,12,18,0.92); border: 1px solid #2a4a2a;
    padding: 14px 16px; min-width: 200px; pointer-events: none;

  .info-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .info-label { color: #556; font-size: 11px; }
  .info-value { color: #aaa; font-size: 11px; }
  #cpm-display { color: #ff5a5a; font-size: 18px; font-weight: bold; }

  #tick-indicator {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    color: #ff3a3a; font-size: 24px; opacity: 0;
    transition: opacity 0.05s; pointer-events: none;
    text-shadow: 0 0 10px #ff0000;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTick() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 3200;
  filter.Q.value = 8;
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(2800, now);
  osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
  gain.gain.setValueAtTime(0.8, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
  osc.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.07);

  const tickEl = document.getElementById('tick-indicator');
  tickEl.style.opacity = '1';
  setTimeout(() => { tickEl.style.opacity = '0'; }, 80);
}

function getDistance() {
  if (!sampleMesh) return 999;
  geigerGroup.getWorldPosition(geigerWorldPos);
  sampleGroup.getWorldPosition(sampleWorldPos);
  return geigerWorldPos.distanceTo(sampleWorldPos);
}

function updateTickRate() {
  if (tickInterval) clearInterval(tickInterval);
  if (!currentElement || !sampleMesh) { document.getElementById('cpm-display').textContent = '0'; return; }

  const dist = getDistance();
  const minDist = 0.3;
  const maxDist = 8;
  const t = Math.max(0, Math.min(1, 1 - (dist - minDist) / (maxDist - minDist)));
  const cpm = Math.round(t * t * currentElement.maxCPM);
  document.getElementById('cpm-display').textContent = cpm;
  document.getElementById('dist-display').textContent = dist.toFixed(1) + ' m';
  document.getElementById('dose-display').textContent = (t * t * currentElement.doseFactor).toFixed(1) + ' μSv/h';

  if (cpm < 2) return;
  const intervalMs = Math.max(60, 60000 / cpm);
  tickInterval = setInterval(playTick, intervalMs);
  playTick();
}

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080c14);
  scene.fog = new THREE.Fog(0x080c14, 12, 28);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 5.5, 9);
  camera.lookAt(0, 1, 0);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;

  raycaster = new THREE.Raycaster();

  buildRoom();
  buildTable();
  buildGeiger();
  buildUI();
  setupEvents();

  animate();
}

function buildRoom() {
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshLambertMaterial({ color: 0x0d1218 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const wallMat = new THREE.MeshLambertMaterial({ color: 0x0c1015 });
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), wallMat);
  backWall.position.set(0, 8, -14);
  scene.add(backWall);
  const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), wallMat);
  leftWall.position.set(-14, 8, 0);
  leftWall.rotation.y = Math.PI / 2;
  scene.add(leftWall);
  const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 16), wallMat);
  rightWall.position.set(14, 8, 0);
  rightWall.rotation.y = -Math.PI / 2;
  scene.add(rightWall);

  const ceilingLight = new THREE.SpotLight(0xddeeff, 2.8, 22, Math.PI / 3, 0.6, 1.5);
  ceilingLight.position.set(0, 12, 0);
  ceilingLight.target.position.set(0, 0, 0);
  ceilingLight.castShadow = true;
  ceilingLight.shadow.mapSize.width = 2048;
  ceilingLight.shadow.mapSize.height = 2048;
  scene.add(ceilingLight);
  scene.add(ceilingLight.target);

  const ambient = new THREE.AmbientLight(0x112233, 0.7);
  scene.add(ambient);

  const lampGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.1, 16);
  const lampMat = new THREE.MeshBasicMaterial({ color: 0xeeeeff });
  const lamp = new THREE.Mesh(lampGeo, lampMat);
  lamp.position.set(0, 11.95, 0);
  scene.add(lamp);
}

function buildTable() {
  tableGroup = new THREE.Group();

  const topGeo = new THREE.BoxGeometry(7, 0.15, 3.5);
  const topMat = new THREE.MeshLambertMaterial({ color: 0x2a1f14 });

  top.castShadow = true;
  top.receiveShadow = true;
  tableGroup.add(top);

  const legMat = new THREE.MeshLambertMaterial({ color: 0x1e1610 });
  const legPositions = [[-3.2, -1.6], [3.2, -1.6], [-3.2, 1.6], [3.2, 1.6]];
  legPositions.forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 2.1, 8), legMat);
    leg.position.set(x, 0.95, z);
    leg.castShadow = true;
    tableGroup.add(leg);
  });

  const edgeMat = new THREE.MeshLambertMaterial({ color: 0x1a1208 });
  const edgeGeo = new THREE.BoxGeometry(7.1, 0.08, 0.05);
  [-1.74, 1.74].forEach(z => {
    const edge = new THREE.Mesh(edgeGeo, edgeMat);
    edge.position.set(0, 2.04, z);
    tableGroup.add(edge);
  });

  scene.add(tableGroup);
}

    const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.06, 8), knobMat);
    knob.position.set(0.28, 0.08, z);
    knob.rotation.z = Math.PI / 2;

  const labelMat = new THREE.MeshBasicMaterial({ color: 0x88ff88 });
  const labelMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.02, 0.08), labelMat);
  labelMesh.position.set(0, 0.115, 0.5);
  geigerGroup.add(labelMesh);

  geigerMesh = body;
  geigerGroup.position.set(2.8, 2.18, -0.3);
  geigerGroup.rotation.y = -0.3;
  scene.add(geigerGroup);

  dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -2.18);
}

  const rockGeo = buildRockGeometry();
  const rockMat = new THREE.MeshLambertMaterial({ color: element.rockColor });
  sampleMesh = new THREE.Mesh(rockGeo, rockMat);
  sampleMesh.castShadow = true;
  sampleGroup.add(sampleMesh);

  const glowLight = new THREE.PointLight(element.glowColor, 0.4, 2.5);
  glowLight.position.set(0, 0.3, 0);
  sampleGroup.add(glowLight);

  const glowGeo = new THREE.SphereGeometry(0.28, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: element.glowColor, transparent: true, opacity: 0.08
  });
  sampleGlow = new THREE.Mesh(glowGeo, glowMat);
  sampleGroup.add(sampleGlow);

  sampleGroup.position.set(0, 2.22, 0);
  scene.add(sampleGroup);

  spawnParticles(element);
}

function buildRockGeometry() {
  const geo = new THREE.DodecahedronGeometry(0.22, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i,
      pos.getX(i) + (Math.random() - 0.5) * 0.07,
      pos.getY(i) + (Math.random() - 0.5) * 0.07,
      pos.getZ(i) + (Math.random() - 0.5) * 0.07
    );
  }
  geo.computeVertexNormals();
  return geo;
}

function spawnParticles(element) {
  particles.forEach(p => scene.remove(p.mesh));
  particles = [];
  const count = Math.round(element.activity * 30);
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.012, 4, 4);
    const mat = new THREE.MeshBasicMaterial({ color: element.glowColor, transparent: true, opacity: 0.8 });
    const mesh = new THREE.Mesh(geo, mat);
    const angle = Math.random() * Math.PI * 2;
    const elev = (Math.random() - 0.5) * Math.PI;
    particles.push({
      mesh,
      origin: new THREE.Vector3(0, 2.22, 0),
      dir: new THREE.Vector3(
        Math.cos(angle) * Math.cos(elev),
        Math.sin(elev),
        Math.sin(angle) * Math.cos(elev)
      ),
      speed: 0.5 + Math.random() * 1.5,
      life: 0, maxLife: 0.8 + Math.random() * 1.2,
      delay: Math.random() * 2
    });
    scene.add(mesh);
  }
}

function radSvg(color) {
  return `<svg class="rad-sign" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
    <circle cx="10" cy="10" r="9.5" fill="${color}22" stroke="${color}" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="2.2" fill="${color}"/>
    <path d="M10 7.8 A3.8 3.8 0 0 1 13.3 11.7 L11.2 12.8 A1.6 1.6 0 0 0 10 9.4 Z" fill="${color}"/>
    <path d="M10 7.8 A3.8 3.8 0 0 0 6.7 11.7 L8.8 12.8 A1.6 1.6 0 0 1 10 9.4 Z" fill="${color}"/>
    <path d="M13.3 11.7 A3.8 3.8 0 0 1 6.7 11.7 L8.8 12.8 A1.6 1.6 0 0 0 11.2 12.8 Z" fill="${color}"/>
  </svg>`;
}

function buildUI() {
  const list = document.getElementById('elements-list');
  ELEMENTS.forEach(el => {
    const div = document.createElement('div');
    div.className = 'element-item';
    div.innerHTML = `
      <div class="el-symbol-wrap">
        <div class="el-symbol" style="background:${el.color}22;border-color:${el.color};color:${el.color}">${el.symbol}</div>
        ${radSvg(el.color)}
      </div>
      <div class="el-info">
        <div class="el-name">${el.name}</div>
        <div class="el-detail">${el.description} • T½: ${el.halfLife}</div>
      </div>
      <div class="el-activity">
        <div style="color:${el.color};font-size:10px">${el.activityPct}%</div>
        <div class="activity-bar"><div class="activity-fill" style="width:${el.activityPct}%;background:${el.color}"></div></div>
      </div>
    `;
    div.addEventListener('click', () => selectElement(el, div));
    list.appendChild(div);
  });
}

function selectElement(el, div) {
  document.querySelectorAll('.element-item').forEach(d => d.classList.remove('active'));
  div.classList.add('active');
  currentElement = el;
  document.getElementById('el-name-display').textContent = el.symbol;
  document.getElementById('elements-panel').classList.remove('open');
  panelOpen = false;
  buildSample(el);
  updateTickRate();
  document.getElementById('hint').style.display = 'none';
  document.getElementById('drag-hint').style.display = 'block';
  const emEl = document.getElementById('emission-display');
  emEl.innerHTML = el.emission.split('\n').map((line, i) =>
    `<span style="display:block;${i===0?'color:#bbb;':'color:#667;'}">${line}</span>`
  ).join('');
}

function setupEvents() {
  const canvas = renderer.domElement;

  document.getElementById('elements-btn').addEventListener('click', () => {
    panelOpen = !panelOpen;
    document.getElementById('elements-panel').classList.toggle('open', panelOpen);
    initAudio();
  });

  canvas.addEventListener('mousedown', onMouseDown);
  canvas.addEventListener('mousemove', onMouseMove);
  canvas.addEventListener('mouseup', onMouseUp);
  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onMouseUp);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function getNDC(clientX, clientY) {
  return {
    x: (clientX / window.innerWidth) * 2 - 1,
    y: -(clientY / window.innerHeight) * 2 + 1
  };
}

function onMouseDown(e) {
  initAudio();
  const ndc = getNDC(e.clientX, e.clientY);
  mouse.x = ndc.x; mouse.y = ndc.y;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(geigerGroup.children, true);
  if (hits.length > 0) {
    isDraggingGeiger = true;
    canvas.style.cursor = 'grabbing';
    const intersect = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, intersect);
    dragOffset.copy(geigerGroup.position).sub(intersect);
  }
}

const canvas = document.getElementById('canvas');

function onMouseMove(e) {
  if (!isDraggingGeiger) return;
  const ndc = getNDC(e.clientX, e.clientY);
  mouse.x = ndc.x; mouse.y = ndc.y;
  raycaster.setFromCamera(mouse, camera);
  const intersect = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, intersect);
  const newPos = intersect.add(dragOffset);
  newPos.x = Math.max(-3.2, Math.min(3.2, newPos.x));
  newPos.z = Math.max(-1.5, Math.min(1.5, newPos.z));
  newPos.y = 2.18;
  geigerGroup.position.copy(newPos);
  updateTickRate();
}

function onMouseUp() {
  isDraggingGeiger = false;
  canvas.style.cursor = 'default';
}

function onTouchStart(e) {
  e.preventDefault();
  const t = e.touches[0];
  onMouseDown({ clientX: t.clientX, clientY: t.clientY });
}

function onTouchMove(e) {
  e.preventDefault();
  const t = e.touches[0];
  onMouseMove({ clientX: t.clientX, clientY: t.clientY });
}

let time = 0;
function animate() {
  requestAnimationFrame(animate);
  time += 0.016;

  if (sampleGroup) {
    sampleGroup.rotation.y = time * 0.4;
    if (sampleGlow) {
      const pulse = 0.07 + Math.sin(time * 3) * 0.03;
      sampleGlow.material.opacity = pulse;
    }
  }

  if (geigerScreen && currentElement) {
    const dist = getDistance();
    const t = Math.max(0, 1 - dist / 6);
    geigerScreen.material.color.setHex(
      t > 0.1 ? 0x002200 + Math.round(t * 0x00aa00) : 0x001100
    );
  }

  particles.forEach(p => {
    p.delay -= 0.016;
    if (p.delay > 0) { p.mesh.visible = false; return; }
    p.mesh.visible = true;
    p.life += 0.016;
    if (p.life > p.maxLife) {
      p.life = 0;
      p.delay = Math.random() * 1.5;
      const angle = Math.random() * Math.PI * 2;
      const elev = (Math.random() - 0.5) * Math.PI;
      p.dir.set(Math.cos(angle) * Math.cos(elev), Math.sin(elev), Math.sin(angle) * Math.cos(elev));
    }
    const frac = p.life / p.maxLife;
    const d = frac * p.speed;
    p.mesh.position.copy(p.origin).addScaledVector(p.dir, d);
    p.mesh.material.opacity = Math.max(0, 0.8 * (1 - frac * frac));
  });

  renderer.render(scene, camera);
}

init();
</script>
